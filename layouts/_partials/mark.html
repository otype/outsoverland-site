<svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="mark-top"><rect x="0" y="0" width="40" height="20"/></clipPath>
    <clipPath id="mark-bottom"><rect x="0" y="20" width="40" height="20"/></clipPath>
  </defs>
  <!-- sun, over the horizon: solid -->
  <circle cx="20" cy="20" r="11" fill="currentColor" clip-path="url(#mark-top)"/>
  <!-- sun, under the horizon: outline only -->
  <circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-dasharray="2 4.2" stroke-linecap="round" clip-path="url(#mark-bottom)"/>
  <!-- the horizon -->
  <line x1="1" y1="20" x2="39" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
