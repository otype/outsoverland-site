<footer class="site-foot">
  <div class="foot-brand">
    {{ partial "mark.html" . }}
    <span>{{ i18n "backronym" }}</span>
  </div>
  <nav class="foot-nav" aria-label="{{ i18n "footerNav" }}">
    {{ range site.Menus.footer }}
    <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
    {{ end }}
    <span class="foot-legal">&copy; {{ now.Year }} {{ site.Params.author }}</span>
  </nav>
</footer>
