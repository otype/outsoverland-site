{{- $n := . -}}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{{- if eq $n "youtube" -}}
  <rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.2l5 2.8-5 2.8z" fill="currentColor" stroke="none"/>
{{- else if eq $n "instagram" -}}
  <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
{{- else if eq $n "mail" -}}
  <rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3.5 7l7.3 5.2a2 2 0 002.4 0L20.5 7"/>
{{- else -}}
  <circle cx="12" cy="12" r="9"/>
{{- end -}}
</svg>
